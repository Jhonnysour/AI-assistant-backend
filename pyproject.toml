[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-backend"
version = "0.0.1"
description = "Backend del asistente personal."
requires-python = ">=3.12"
# Versiones consultadas en PyPI el 2026-10-29 (persistencia: 2026-10-30).
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]==2.1.6",  # Desde 2.1, greenlet solo se instala con el extra asyncio.
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 1.10 recomienda httpx2 para su TestClient; httpx 0.28 sigue funcionando.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
